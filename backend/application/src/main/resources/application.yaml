spring:
  application:
    name: edge-relative
  # Import the git-ignored local secrets file. Optional, and searched from the
  # working directory upwards, so it works from the repo root, backend/, or the
  # module directory. Exported environment variables still take precedence.
  config:
    import:
      - optional:file:./secrets.properties
      - optional:file:../secrets.properties
      - optional:file:../../secrets.properties
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      connection-timeout: 5000
      validation-timeout: 2000
      connection-init-sql: SET TIME ZONE 'UTC'
  jooq:
    sql-dialect: POSTGRES
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

broker:
  groww:
    enabled: true
    base-url: ${GROWW_BASE_URL:https://api.groww.in}
    instrument-master-url: ${GROWW_INSTRUMENT_MASTER_URL:https://growwapi-assets.groww.in/instruments/instrument.csv}
    api-version: "1.0"
    connect-timeout: 5s
    request-timeout: 15s
    operation-timeout: 20s
    max-in-flight: 64
    bulk-max-concurrency: 8
    # The ~140k-row instrument master is cached; avoids re-downloading it on every lookup.
    instrument-master-cache-ttl: 30m
    credentials:
      # Never commit real credentials. Bind from environment or a secret reference.
      # AUTO uses whichever credentials are set; explicit mode overrides when usable.
      mode: ${GROWW_AUTH_MODE:AUTO}
      access-token: ${GROWW_ACCESS_TOKEN:}
      api-key: ${GROWW_API_KEY:}
      api-secret: ${GROWW_API_SECRET:}
      totp-code: ${GROWW_TOTP_CODE:}
    rate-limits:
      authentication:
        - window: 1s
          limit: 5
        - window: 1m
          limit: 30
        - window: 24h
          limit: 150
      orders:
        - window: 1s
          limit: 10
        - window: 1m
          limit: 250
      live-data:
        - window: 1s
          limit: 10
        - window: 1m
          limit: 300
      non-trading:
        - window: 1s
          limit: 20
        - window: 1m
          limit: 500
    retry:
      max-attempts: 3
      initial-backoff: 200ms
      multiplier: 2.0
      max-backoff: 2s
      budget: 20s
      jitter: 0.5
    circuit-breaker:
      failure-threshold: 5
      open-duration: 30s
      half-open-probes: 1
    cooldown:
      default-duration: 5s

llm:
  # Advisory narration only; never trading authority (DD-06 §2, ADR-007). The Java backend is the
  # only process that calls the provider, so the key never reaches the browser or the macOS app. An
  # empty key disables narration instead of failing startup.
  enabled: true
  provider: ${LLM_PROVIDER:deepseek}
  api-key: ${LLM_API_KEY:}
  request-timeout: 30s
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-chat}
    path: /chat/completions

fundamentals:
  # Free-first NSE/BSE fundamentals (DD-06, ADR-005). Yahoo needs no key; FUNDAMENTALS_API_KEY is
  # reserved for a future paid vendor behind the same port. Yahoo is an observation-time source:
  # the adapter records the request instant as the filing time so point-in-time reads stay safe.
  enabled: true
  provider: ${FUNDAMENTALS_PROVIDER:yahoo-nse}
  api-key: ${FUNDAMENTALS_API_KEY:}
  query-base-url: ${FUNDAMENTALS_QUERY_BASE_URL:https://query1.finance.yahoo.com}
  fallback-query-base-url: ${FUNDAMENTALS_FALLBACK_QUERY_BASE_URL:https://query2.finance.yahoo.com}
  cookie-base-url: ${FUNDAMENTALS_COOKIE_BASE_URL:https://fc.yahoo.com}
  # Yahoo gates quote-summary behind a cookie + crumb and rate-limits non-browser clients.
  crumb-ttl: 30m
  min-request-interval: 1s
  suffix-nse: .NS
  suffix-bse: .BO
  request-timeout: 30s

history:
  backfill:
    # Low-priority background workload: bounded workers/queue, chunk-by-chunk.
    workers: 2
    queue-capacity: 50
    sweep-interval: 2s
    insert-batch-size: 1000
    # Bounds the M1 rows loaded to derive a higher-timeframe series on the read path.
    max-source-candles: 500000
  replay:
    # Server-side replay/batch reads (backtest, dataset manifest) are not clamped to the interactive
    # 10k-bar cap; these generous but bounded limits allow multi-year windows.
    max-bars: 2000000
    max-source-candles: 3000000

feature:
  # Every value below is a RESEARCH CANDIDATE, not a validated production constant, and is folded
  # into each feature version's parameter hash. Changing a value changes the parameter hash, so an
  # existing RRS_V1 row can never be silently reinterpreted. See docs/design-docs/dev/ADR-002.
  # Longer than the deepest mandatory warmup (50-session RVOL baseline) so M5 and D1 both warm up
  # from canonical M1 without loading more than necessary (~62 NSE sessions).
  history-days: 90
  benchmark:
    # DD-02 selects NIFTY 50 for Strategy V1; NIFTY 500 remains the documented research challenger.
    market-code: NIFTY50
  corporate-actions:
    # DD-05 §113: features may read the versioned split/bonus-adjusted series for continuity while
    # raw candles stay untouched. Enable once the relevant factors are ingested; an unsupported
    # action then fails closed rather than silently mixing raw and adjusted prices.
    adjusted-inputs: false
  atr:
    # DD-02 §34 candidates: ~50 trading hours of M5 (600 bars) and ~50 D1 sessions.
    length-by-timeframe:
      M1: 3000
      M5: 600
      M15: 200
      M30: 100
      H1: 50
      H4: 13
      D1: 50
      W1: 50
    default-length: 600
    smoothing: WILDER
  rrs:
    price-change: CLOSE_TO_CLOSE
    # DD-02 §35: the RDT example uses 3/8; Edge Relative will test this pair, it is not proven optimal.
    fast-length: 3
    slow-length: 8
    persistence-window: 8
    slope-lookback: 3
    percentile-window: 500
    # DD-05 §151 rolling percentile: require enough observations that the distribution is meaningful;
    # without this the first finite RRS bar would report a degenerate percentile of 1.0.
    percentile-min-samples: 20
  rvol:
    # DD-02 §44-§47: 50 sessions is a primary candidate; estimator is versioned.
    estimator: MEAN
    daily-lookback: 50
    interval-lookback: 50
    cumulative-lookback: 50
    min-samples: 20
    trimmed-fraction: 0.1
    ew-span: 20
  rve:
    # DD-02 §50; mirrors the RRS fast/slow pair until research says otherwise.
    fast-length: 3
    slow-length: 8
  structure:
    pivot-width: 3
    efficiency-window: 20
  directional-volume:
    window: 20
  live:
    # Bounded in-memory buffer per series; enough for ATR/RVOL warmup without loading history.
    max-bars: 4000
  dashboard:
    # On-demand dashboard/diagnostics/stream computations are shared for this window. Canonical
    # candles change only on ingestion, so a few seconds is a cheap observability trade.
    cache-ttl: 8s
  persistence:
    enabled: true
    # Bounded queue; a full queue drops rebuildable persistence and increments a counter.
    queue-capacity: 2000
  stream:
    producer:
      # Incremental feature.update producer. Disabled until a live market-data producer updates the
      # canonical store, otherwise it would re-broadcast on ingestion.
      enabled: false
      interval-ms: 5000

market:
  # Point-in-time sector membership, seeded into reference.instrument_sector_history. Only sectors
  # with a verified NSE index benchmark are mapped; RELIANCE, BHARTIARTL and ADANIENT are omitted
  # because Groww exposes no NIFTY Energy/Telecom/appropriate sector index, so their sector context
  # is reported unavailable rather than substituted.
  sector-map:
    SBIN: PSU_BANK
    ICICIBANK: PRIVATE_BANK
    HDFCBANK: PRIVATE_BANK
    TCS: IT
  calendar:
    # NSE Capital Market (cash equities) trading holidays, per the official NSE holiday master.
    # Maintained as data: refresh when the annual NSE circular is published. Dates that fall on a
    # weekend are harmless but kept so the list matches the source.
    holidays:
      - 2026-01-15 # Municipal Corporation Election - Maharashtra
      - 2026-01-26 # Republic Day
      - 2026-02-15 # Mahashivratri (Sunday)
      - 2026-03-03 # Holi
      - 2026-03-21 # Id-Ul-Fitr (Ramadan Eid) (Saturday)
      - 2026-03-26 # Shri Ram Navami
      - 2026-03-31 # Shri Mahavir Jayanti
      - 2026-04-03 # Good Friday
      - 2026-04-14 # Dr. Baba Saheb Ambedkar Jayanti
      - 2026-05-01 # Maharashtra Day
      - 2026-05-28 # Bakri Id
      - 2026-06-26 # Muharram
      - 2026-08-15 # Independence Day (Saturday)
      - 2026-09-14 # Ganesh Chaturthi
      - 2026-10-02 # Mahatma Gandhi Jayanti
      - 2026-10-20 # Dussehra
      - 2026-11-08 # Diwali Laxmi Pujan (Sunday; Muhurat trading)
      - 2026-11-10 # Diwali-Balipratipada
      - 2026-11-24 # Prakash Gurpurb Sri Guru Nanak Dev
      - 2026-12-25 # Christmas
    # Special/shortened sessions (DD-05 §116): a date plus an explicit IST window. Dates listed
    # here are trading days with that window even on a weekend or holiday (e.g. Muhurat trading).
    # Add the official window when the annual NSE circular specifies it.
    special-sessions: []
    # special-sessions:
    #   - date: 2026-11-08
    #     open: "18:00"
    #     close: "19:00"

server:
  address: 127.0.0.1
  compression:
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        enabled: false
  endpoint:
    health:
      show-details: never
