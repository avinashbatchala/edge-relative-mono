[project]
name = "edge-relative-research"
version = "0.1.0"
description = "Research package for Edge Relative."
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build==0.12.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
